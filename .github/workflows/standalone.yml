name: XMQ standalone — two radios
on:
  push:
    branches: [experimental/xmq-auto-drivers]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xmq-clean-one-check
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Generate C++ driver header from independent XMQ sources
        run: python components/xmq_meter/generate_drivers.py
      - name: Test auto-generated XMQ driver catalog and MVT selection
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -pedantic -Icomponents/xmq_meter tests/test_driver_catalog.cpp -o /tmp/xmq-catalog
          /tmp/xmq-catalog
      - name: Test standalone XMQ engine with synthetic meters
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -pedantic -Icomponents/xmq_meter tests/test_standalone_engine.cpp -o /tmp/xmq-engine
          /tmp/xmq-engine
      - name: Verify replacing one .xmq driver changes only its generated function
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import shutil
          base = Path("components/xmq_meter")
          spec = importlib.util.spec_from_file_location("gen", base / "generate_drivers.py")
          gen = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gen)
          with TemporaryDirectory() as tmp:
              copied = Path(tmp)
              shutil.copytree(base / "drivers", copied / "drivers")
              shutil.copy2(base / "validated_profiles.json", copied / "validated_profiles.json")
              shutil.copy2(base / "transport_signatures.json", copied / "transport_signatures.json")
              original = gen.generate_driver_header(copied).read_text()
              driver = copied / "drivers" / "mkradio4.xmq"
              driver.write_text(driver.read_text() + "\n// Driver-local update only\n")
              modified = gen.generate_driver_header(copied).read_text()
              assert modified != original
              for name in ("fhkvdataiii", "mkradio4a"):
                  def func(text, name):
                      start = text.index("inline const char *source_" + name + "()")
                      end = text.find("inline const char *source_", start + 1)
                      if end == -1:
                          end = text.index("}  // namespace xmq_runtime", start)
                      return text[start:end]
                  assert func(original, name) == func(modified, name)
              assert func(original, "mkradio4") != func(modified, "mkradio4")
              print("INDEPENDENT_XMQ_DRIVER_REPLACEMENT_OK")
          PY
      - name: Test new XMQ driver auto-discovery without activation
        run: python tests/test_new_driver_isolation.py
      - name: Test approved driver and YAML family consistency
        run: python tests/test_yaml_profile_validation.py
      - name: Test reviewed proprietary transport signatures
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Icomponents/xmq_meter tests/test_transport_signatures.cpp -o /tmp/xmq-signatures
          /tmp/xmq-signatures
      - name: Verify transport-approved driver binds MVT and XMQ output
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -pedantic -Icomponents/xmq_meter tests/test_transport_driver_binding.cpp -o /tmp/xmq-transport-binding
          /tmp/xmq-transport-binding
      - name: Reject overlapping clear and encrypted transport signatures
        run: python tests/test_transport_signature_collisions.py
      - name: Ensure each validated driver has reviewed clear-form transport
        run: python tests/test_validated_transport_coverage.py
      - name: Verify approved clear-form transport MVT matches independent XMQ driver
        run: python tests/test_transport_mvt_consistency.py
      - name: Decode mkradio4a warm and cold upstream OMS telegram fixtures
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -pedantic -Icomponents/xmq_meter tests/test_mkradio4a_upstream.cpp -o /tmp/xmq-mkradio4a
          /tmp/xmq-mkradio4a
      - name: Parse mkradio4a CI72 full frames and verify inner meter identity
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -pedantic -Icomponents/xmq_meter tests/test_mkradio4a_ci72.cpp -o /tmp/xmq-mkradio4a-ci72
          /tmp/xmq-mkradio4a-ci72
      - name: Require complete mkradio4a CI72 target volume and date before acceptance
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -pedantic -Icomponents/xmq_meter tests/test_mkradio4a_candidate.cpp -o /tmp/xmq-mkradio4a-candidate
          /tmp/xmq-mkradio4a-candidate
      - name: Test pending encrypted mode cannot be decoded
        run: python tests/test_encrypted_pending.py
      - name: Test encrypted input boundary always rejects until crypto is implemented
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -pedantic -Icomponents/xmq_meter tests/test_encrypted_input_gate.cpp -o /tmp/xmq-enc-gate
          /tmp/xmq-enc-gate
      - name: Test AES-128-CBC NIST vector offline; no publishing authorization
        run: python tests/test_aes_cbc_nist_vector.py
      - name: Test native AES-CBC primitive host-only, no ESPHome publication
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -pedantic -Icomponents/xmq_meter tests/test_aes_cbc_host_probe.cpp -lcrypto -o /tmp/xmq-aes-host
          /tmp/xmq-aes-host
      - name: Test encrypted WMBus fixture intake rejects missing metadata and secrets
        run: python tests/test_encrypted_fixture_contract.py
      - name: Scan every encrypted reference fixture for duplicates and unsafe claims
        run: |
          set -euo pipefail
          python tests/scan_encrypted_fixtures.py
          python tests/test_encrypted_corpus.py
      - name: Test AES-CMAC RFC 4493 host vectors, never authorize publication
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -pedantic -Icomponents/xmq_meter tests/test_aes_cmac_rfc4493.cpp -lcrypto -o /tmp/xmq-cmac
          /tmp/xmq-cmac
      - name: Test independent T1/C1 PHY CRC
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tests/test_phy_crc.cpp -o /tmp/xmq-crc
          /tmp/xmq-crc
      - name: Install ESPHome 2026.11.0
        run: python -m pip install --disable-pip-version-check "esphome==2026.11.0"
      - name: Compile Heltec SX126x with 12 synthetic XMQ sensors
        run: |
          set -euo pipefail
          rm -f components/xmq_meter/xmq_driver_sources.h
          esphome compile tests/heltec-xmq-12-build.yaml
          test -e components/xmq_meter/xmq_driver_sources.h
      - name: Compile LILYGO SX127x without meter sensors
        run: esphome compile tests/lilygo-sx127x-radio-build.yaml
      - name: Assert no legacy dependencies
        run: |
          set -euo pipefail
          test ! -d components/wmbus_common
          test ! -d components/wmbus_meter
          ! grep -R -E '#include.*wmbus_common/|wmbus_common:' components tests
          test -e components/xmq_meter/drivers/fhkvdataiii.xmq
          test -e components/xmq_meter/drivers/mkradio4.xmq
          test -e components/xmq_meter/drivers/mkradio4a.xmq
          python components/xmq_meter/generate_drivers.py
          test -e components/xmq_meter/xmq_driver_sources.h
